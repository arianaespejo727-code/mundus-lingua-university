<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="login.css">
<link class="icon" type="image/png" href="img/ICONOMUNDUS.png">
<title>Mundus Lingua | Acceso al Sistema</title>
</head>
<body>

<main class="login-main">
  <div class="login-card">
    <div class="login-logo">
      <img src="img/ICONOMUNDUS.png" alt="Icono Mundus Lingua" class="login-logo-icono" width="40" height="40">
      <span>MUNDUS <em>LINGUA</em></span>
    </div>

    <h1>Acceso al Sistema</h1>
    <p class="subtitle">Ingresa tus credenciales de alumno</p>

    <form id="loginForm">

      <div class="field">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="off" required>
        <p class="hint">Ingresa la contraseña que creaste en tu formulario de matrícula</p>
      </div>

      <p id="attemptsMsg" class="attempts-msg">Intentos restantes: 3</p>
      <p id="blockedMsg" class="blocked-msg" hidden>Superaste los intentos permitidos</p>
      <p id="errorMsg" class="error-msg"></p>

      <button type="submit" id="ingresarBtn" class="btn btn-primary">Ingresar</button>
      <button type="button" id="salirBtn" class="btn btn-danger">Salir</button>

      <a href="olvide.html" class="forgot-link">Olvidé contraseña</a>
    </form>
  </div>
</main>

<script>
(function(){
  // ===== URL DE TU GOOGLE APPS SCRIPT =====
  const APPS_SCRIPT_URL = 'https://google.com';

  // Tus usuarios fijos originales
  var USERS = [
    { nombre: 'dina', apellido: 'boluarte', pass: '66666666', correo: 'dinaboluarte@gmail.com', nombreCompleto: 'Dina Boluarte', nacimiento: '01-02-2000', sexo: 'Mujer' },
    { nombre: 'pedro', apellido: 'castillo', pass: '50505050', correo: 'pedroboluarte@gmail.com', nombreCompleto: 'Pedro Castillo', nacimiento: '01-01-2000', sexo: 'Hombre' }
  ];

  var MAX_ATTEMPTS = 3;
  var attempts = parseInt(localStorage.getItem('ml_attempts') || '0', 10);

  var nombreInput = document.getElementById('nombre');
  var apellidoInput = document.getElementById('apellido');
  var passInput = document.getElementById('password');
  var loginForm = document.getElementById('loginForm');
  var attemptsMsg = document.getElementById('attemptsMsg');
  var blockedMsg = document.getElementById('blockedMsg');
  var errorMsg = document.getElementById('errorMsg');

  if (attempts >= MAX_ATTEMPTS) applyBlock();

  function normalize(str) { return str.trim().toLowerCase(); }

  function applyBlock() {
    blockedMsg.hidden = false;
    attemptsMsg.hidden = true;
    nombreInput.disabled = true;
    apellidoInput.disabled = true;
    passInput.disabled = true;
    document.getElementById('ingresarBtn').disabled = true;
  }

  async function sendToSheets(nombre, apellido, status, intentos) {
    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, apellido, status, intentos, fecha: new Date().toISOString() })
      });
    } catch (e) { console.error(e); }
  }

  loginForm.addEventListener('submit', async function(evento){
    evento.preventDefault();

    var nombre = normalize(nombreInput.value);
    var apellido = normalize(apellidoInput.value);
    var pass = passInput.value.trim();

    // 1. BUSCAMOS PRIMERO EN LOS NUEVOS ALUMNOS MATRICULADOS
    let listaAlumnosDinamicos = JSON.parse(localStorage.getItem("alumnosMundus")) || [];
    
    // Corregido: Buscamos u.pass de forma unificada con tu base de datos local
    let found = listaAlumnosDinamicos.find(u => normalize(u.nombre) === nombre && normalize(u.apellido) === apellido && u.pass === pass);

    // 2. SI NO EXISTE, BUSCAMOS EN TU LISTA FIJA (DINA O PEDRO)
    if (!found) {
      found = USERS.find(u => normalize(u.nombre) === nombre && normalize(u.apellido) === apellido && u.pass === pass);
    }

    if (found) {
      await sendToSheets(nombre, apellido, 'exitoso', attempts + 1);
      localStorage.setItem('ml_session', JSON.stringify(found));
      localStorage.removeItem('ml_attempts');
      window.location.href = 'intranet.html';
    } else {
      attempts++;
      localStorage.setItem('ml_attempts', attempts);
      await sendToSheets(nombre, apellido, 'fallido', attempts);

      if (attempts >= MAX_ATTEMPTS) {
        applyBlock();
      } else {
        errorMsg.textContent = 'Credenciales incorrectas.';
        attemptsMsg.textContent = 'Intentos restantes: ' + (MAX_ATTEMPTS - attempts);
      }
    }
  });

  document.getElementById('salirBtn').addEventListener('click', function(){
    nombreInput.value = '';
    apellidoInput.value = '';
    passInput.value = '';
    errorMsg.textContent = '';
  });
})();
</script>
<script src="script.js"></script>

</body>
</html>
